# Search Console data: every 2 days it rewrites licenta-stats/gsc.csv (daily Search Console totals for
# licenta-disertatie-romania.com, scripts/fetch-gsc.mjs) and opens one PR `gsc-data/<date>`, or pushes
# to its PR while that one is still open. No PR when Google has no new day. A plain script, no Claude:
# it replaces the claude.ai routine (2026-11-01); the twin workflow is search-console.yml in
# ChopinF/licenta-site. Manual: Actions → Search Console data → Run workflow.
# Needs the GSC_KEY_JSON secret (the same service-account key as licenta-site) and "Allow GitHub
# Actions to create and approve pull requests" (Settings → Actions → General).
name: Search Console data

on:
  schedule:
    - cron: '30 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gsc-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSV: licenta-stats/gsc.csv
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Branch
        id: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          open=$(gh pr list --state open --json number,headRefName \
            -q 'map(select(.headRefName | startswith("gsc-data/"))) | .[0] | select(.) | "\(.number) \(.headRefName)"')
          if [ -n "$open" ]; then
            pr=${open%% *}; branch=${open#* }
            git checkout -B "$branch" "origin/$branch"
            git merge --no-edit origin/main
          else
            pr=""; branch="gsc-data/$(date -u +%F)"
            git checkout -B "$branch" origin/main
          fi
          echo "prev=$(git cat-file -p "origin/main:$CSV" | tail -n 1 | cut -d, -f1)" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Fetch
        id: fetch
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          if [ -z "$GSC_KEY_JSON" ]; then
            echo "::error::The GSC_KEY_JSON secret is missing: add the Search Console service-account key."
            exit 1
          fi
          node --version
          node scripts/fetch-gsc.mjs
          if git diff --quiet -- "$CSV"; then
            echo "No new day from Google since the last run: nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and PR
        if: steps.fetch.outputs.changed == 'true'
        env:
          PR: ${{ steps.branch.outputs.pr }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          PREV: ${{ steps.branch.outputs.prev }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          first=$(sed -n 2p "$CSV" | cut -d, -f1)
          last=$(tail -n 1 "$CSV" | cut -d, -f1)
          days=$(tail -n +2 "$CSV" | wc -l | tr -d ' ')
          read -r clicks impr < <(tail -n +2 "$CSV" | tail -n 28 | awk -F, '{c += $2; i += $3} END {print c, i}')
          body="$RUNNER_TEMP/body.md"
          {
            printf '%s\n\n' 'Refreshes `licenta-stats/gsc.csv` (daily Search Console totals for licenta-disertatie-romania.com).'
            printf -- '- Previous last date: %s\n' "$PREV"
            printf -- '- New last date: %s\n' "$last"
            printf -- '- Days in file: %s (%s to %s)\n' "$days" "$first" "$last"
            printf -- '- Last 28 rows: %s clicks, %s impressions\n\n' "$clicks" "$impr"
            printf 'Data only; no other files changed.\n\n---\n'
            printf '_Generated by [Search Console data](%s) (GitHub Actions)_\n' "$RUN_URL"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          title="Search Console data through $last"
          git add "$CSV"
          git commit -q -m "$title"
          git push origin "HEAD:$BRANCH"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body"
          fi
